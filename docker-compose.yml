services:
  db:
    image: postgres:16-alpine
    container_name: calc-crm-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calc_crm
    ports:
      - "5432:5432"
    volumes:
      - calc-crm-db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: calc-crm-backend
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: calc_crm
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  calc-crm-db-data: